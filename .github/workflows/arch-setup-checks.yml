name: Arch setup checks

on:
  push:
    branches:
      - cachyos-setup-script
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  arch:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    timeout-minutes: 15
    steps:
      - name: Install check tools in disposable Arch container
        run: pacman -Syu --noconfirm --needed git python shellcheck
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Check shell scripts
        run: |
          bash -n setup-intune-cachyos.sh quickinstall.sh
          shellcheck --severity=warning setup-intune-cachyos.sh quickinstall.sh
      - name: Test onboarding and setup entrypoints with synthetic data
        run: python -m unittest discover -s tests -v
      - name: Check Arch package metadata without building or installing
        run: |
          useradd --create-home builder
          for package in intune-portal microsoft-identity-broker; do
            cp -R "$package" /home/builder/
            chown -R builder:builder "/home/builder/$package"
            (cd "/home/builder/$package" && runuser -u builder -- makepkg --printsrcinfo > /dev/null)
          done
